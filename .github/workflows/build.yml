name: Build portable EXE

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.rid }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            platform: x64
          - rid: win-arm64
            platform: ARM64

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish single-file portable app
        shell: pwsh
        run: |
          dotnet publish src/StickPanel/StickPanel.csproj `
            --configuration Release `
            --runtime ${{ matrix.rid }} `
            --self-contained true `
            -p:Platform=${{ matrix.platform }} `
            -p:PublishSingleFile=true `
            --output artifacts/${{ matrix.rid }}

          $exe = "artifacts/${{ matrix.rid }}/StickPanel.exe"
          if (-not (Test-Path $exe)) {
            throw "Publish succeeded but StickPanel.exe was not produced."
          }

          Compress-Archive `
            -Path $exe `
            -DestinationPath "artifacts/StickPanel-${{ matrix.rid }}.zip" `
            -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: StickPanel-${{ matrix.rid }}
          path: artifacts/StickPanel-${{ matrix.rid }}.zip
          if-no-files-found: error

  release:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: StickPanel-*
          merge-multiple: true
          path: release

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" release/*.zip \
            --repo "${GITHUB_REPOSITORY}" \
            --generate-notes \
            --title "Stick Panel ${GITHUB_REF_NAME}"
