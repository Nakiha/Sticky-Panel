name: Build Flutter portable app

on:
  push:
    branches: [flutter]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Windows runner
        shell: pwsh
        run: flutter create --platforms=windows --project-name stick_panel --org io.github.nakiha .

      - name: Resolve packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build release
        run: flutter build windows --release

      - name: Package portable ZIP
        shell: pwsh
        run: |
          $release = 'build/windows/x64/runner/Release'
          $exe = Join-Path $release 'stick_panel.exe'
          if (Test-Path $exe) {
            Rename-Item $exe 'StickPanel.exe'
          }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path "$release/*" -DestinationPath 'dist/StickPanel-windows-x64-portable.zip'

      - name: Upload portable build
        uses: actions/upload-artifact@v4
        with:
          name: StickPanel-windows-x64-portable
          path: dist/StickPanel-windows-x64-portable.zip
          if-no-files-found: error
          retention-days: 30
